name: Finance Monitor CI

on:
  pull_request:
    paths:
      - "finance_monitor.py"
      - "finance_monitor_entry.py"
      - "finance_monitor_quality.py"
      - "finance_monitor_quality_entry.py"
      - "config/finance_sources.json"
      - "config/finance_quality_policy.json"
      - "tests/test_finance*.py"
      - ".github/workflows/daily-finance-tax-ai-monitor.yml"
      - ".github/workflows/daily-finance-monitor-quality.yml"
      - ".github/workflows/finance-monitor-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile monitor and optimizer
        run: |
          python -m py_compile \
            finance_monitor.py \
            finance_monitor_entry.py \
            finance_monitor_quality.py \
            finance_monitor_quality_entry.py
      - name: Validate JSON configuration
        run: |
          python -m json.tool config/finance_sources.json >/dev/null
          python -m json.tool config/finance_quality_policy.json >/dev/null
      - name: Run existing finance monitor tests
        run: python -m unittest discover -s tests -p 'test_finance_monitor.py' -v
      - name: Run first-feedback regression tests
        run: python -m unittest discover -s tests -p 'test_finance_first_feedback.py' -v
      - name: Verify specific-project demotion
        run: python -m unittest discover -s tests -p 'test_finance_quality.py' -k test_taxia_activity_is_demoted_to_appendix -v
      - name: Verify baseline and generic-commit demotion
        run: python -m unittest discover -s tests -p 'test_finance_quality.py' -k test_baseline_and_generic_commit_cannot_enter_top_priority -v
      - name: Verify current official-rule promotion
        run: python -m unittest discover -s tests -p 'test_finance_quality.py' -k test_current_official_rule_remains_p0 -v
      - name: Verify core-first section order
        run: python -m unittest discover -s tests -p 'test_finance_quality.py' -k test_section_order_puts_specific_project_last -v
      - name: Verify core summary excludes specific projects
        run: python -m unittest discover -s tests -p 'test_finance_quality.py' -k test_report_core_summary_excludes_taxia -v
      - name: Run bounded quality optimizer tests
        run: python -m unittest discover -s tests -p 'test_finance_quality.py' -k QualityOptimizerTests -v
      - name: Run quality autopilot guard tests
        run: python -m unittest discover -s tests -p 'test_finance_quality_autopilot.py' -v
