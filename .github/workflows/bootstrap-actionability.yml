name: Bootstrap Project Actionability Loop

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap-actionability/**"
      - ".github/workflows/bootstrap-actionability.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-project-actionability-loop
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore verified bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-actionability/part-* | base64 --decode > /tmp/actionability.tar.gz
          echo "6a8546eaaf03aa754bd862dbe15b36c6715131a30359a437a8c651f1d00f2b22  /tmp/actionability.tar.gz" \
            | sha256sum --check --strict
          tar -xzf /tmp/actionability.tar.gz
          rm -rf .bootstrap-actionability
          rm -f .github/workflows/bootstrap-actionability.yml

      - name: Validate restored source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile quality.py self_improve.py
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('config/project-context.json'), Path('config/quality-autotune.json')]:
              json.loads(path.read_text(encoding='utf-8'))
          PY
          python -m unittest tests.test_quality tests.test_self_improve -v

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "project-actionability-bootstrap[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add project actionability and guarded self-improvement"
          git push origin HEAD:main
