name: Deploy AI Finance Tax Accounting Monitor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".finance-bootstrap/**"
      - ".github/workflows/deploy-finance-monitor.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: deploy-ai-finance-tax-accounting-monitor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore verified finance monitor bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f .finance-bootstrap/part-00
          cat .finance-bootstrap/part-* | base64 --decode > /tmp/finance-monitor.tar.gz
          echo "58f3071661f62021e3714f7430df408e51d4b482094a442c75e37a70462dc54c  /tmp/finance-monitor.tar.gz" \
            | sha256sum --check --strict
          rm -rf /tmp/finance-monitor-unpacked
          mkdir -p /tmp/finance-monitor-unpacked
          tar -xzf /tmp/finance-monitor.tar.gz -C /tmp/finance-monitor-unpacked

          install -d config tests .github/workflows
          cp /tmp/finance-monitor-unpacked/finance_monitor.py finance_monitor.py
          cp /tmp/finance-monitor-unpacked/config/finance_sources.json config/finance_sources.json
          cp /tmp/finance-monitor-unpacked/tests/test_finance_monitor.py tests/test_finance_monitor.py
          cp /tmp/finance-monitor-unpacked/.github/workflows/daily-finance-tax-ai-monitor.yml \
            .github/workflows/daily-finance-tax-ai-monitor.yml
          cp /tmp/finance-monitor-unpacked/README.md README.md
          cp /tmp/finance-monitor-unpacked/.gitignore .gitignore
          chmod +x finance_monitor.py

      - name: Validate restored source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile finance_monitor.py
          python -m json.tool config/finance_sources.json >/dev/null
          python -m unittest discover -s tests -p 'test_finance_monitor.py' -v

      - name: Commit deployed finance monitor
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-finance-tax-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md .gitignore finance_monitor.py \
            config/finance_sources.json tests/test_finance_monitor.py \
            .github/workflows/daily-finance-tax-ai-monitor.yml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Finance monitor source already matches the verified bundle."
            exit 0
          fi
          git commit -m "feat: deploy detailed AI finance tax accounting monitor"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch initial finance monitor verification
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'daily-finance-tax-ai-monitor.yml',
              ref: 'main',
              inputs: { lookback_hours: '168' }
            });
            core.info('Dispatched initial finance/tax/accounting monitor verification.');

      - name: Deployment summary
        run: |
          {
            echo "## AI 재무·세무·회계 모니터 배포"
            echo "- 검증 번들 SHA-256: \`58f3071661f62021e3714f7430df408e51d4b482094a442c75e37a70462dc54c\`"
            echo "- Python 단위 테스트: 12개"
            echo "- 정기 실행: 07:00 KST"
            echo "- 누락 감시: 07:20 KST"
            echo "- 초기 7일 기준선 실행을 별도 dispatch함"
          } >> "$GITHUB_STEP_SUMMARY"
