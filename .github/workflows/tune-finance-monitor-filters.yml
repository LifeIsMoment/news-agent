name: Tune Finance Monitor Filters Once

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tune-finance-monitor-filters-once
  cancel-in-progress: false

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tighten observed false-positive filters
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          config_path = Path('config/finance_sources.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))

          news = {row['name']: row for row in config['news_queries']}
          bok = news['KR-BOK-ECOS-API']
          bok['required_all_groups'] = [
              ['ECOS', 'API'],
              ['변경', '개편', '점검', '추가', '버전', '서비스', '개발'],
          ]
          bok['title_required_any'] = ['ECOS', 'API']
          bok['exclude_any'] = sorted(set(bok.get('exclude_any', []) + ['채용', '모집', '입찰']))

          arxiv = {row['name']: row for row in config['arxiv_queries']}
          audit = arxiv['ARXIV-AUDIT-AI']
          audit['required_all_groups'] = [
              ['감사', 'audit', 'assurance', 'internal control', 'fraud', 'SOX'],
              ['large language model', 'LLM', 'agent', 'artificial intelligence'],
              ['accounting', 'financial statement', 'financial reporting', 'assurance', 'internal control', 'external audit', '회계', '재무제표'],
          ]

          for asset in config['github_repositories']:
              asset['baseline_releases'] = 1 if asset['repo'].lower() == 'xaikorea/taxia' else 0

          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          source_path = Path('finance_monitor.py')
          source = source_path.read_text(encoding='utf-8')
          old = 'if baseline and index > int(asset.get("baseline_releases", 0)):\n            break'
          new = 'if baseline and index >= int(asset.get("baseline_releases", 0)):\n            break'
          if old not in source:
              raise SystemExit('baseline release guard pattern not found')
          source_path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate tuned monitor
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile finance_monitor.py
          python -m json.tool config/finance_sources.json >/dev/null
          python -m unittest discover -s tests -p 'test_finance_monitor.py' -v

      - name: Commit filter tuning and remove one-time trigger
        shell: bash
        run: |
          set -euo pipefail
          git rm .finance-tune-trigger .github/workflows/tune-finance-monitor-filters.yml
          git config user.name "ai-finance-tax-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finance_monitor.py config/finance_sources.json
          git commit -m "fix: tighten finance monitor relevance filters"
          git pull --rebase origin main
          git push origin HEAD:main
