name: Cleanup Finance Bootstrap Schedule

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  cleanup:
    if: github.event.issue.title == '[CLEANUP FINANCE MONITOR BOOTSTRAP]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary schedule and cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/TEMP_FINANCE_BOOTSTRAP_20260724/d' .github/workflows/daily-finance-tax-ai-monitor.yml
          git rm .github/workflows/cleanup-finance-bootstrap.yml
          git config user.name "ai-finance-tax-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/daily-finance-tax-ai-monitor.yml
          git commit -m "ci: finalize finance monitor schedule"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Close cleanup issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '임시 부트스트랩 주기를 제거했습니다. 07:00 본 실행과 07:20 누락 감시만 유지합니다.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
