name: Bootstrap AI monitoring automation

on:
  push:
    paths:
      - ".bootstrap/trigger"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bootstrap-ai-monitor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify and extract deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | tr -d '\r\n' | base64 -d > /tmp/news-agent-bundle.tar.gz
          echo "2f7f0ec1f83678b5e32b76767097bad2e3fcecccba497044fdb664af0329910f  /tmp/news-agent-bundle.tar.gz" | sha256sum -c -
          tar -xzf /tmp/news-agent-bundle.tar.gz

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Generate initial report
        id: collect
        continue-on-error: true
        shell: bash
        run: |
          python monitor.py \
            --lookback-hours 96 \
            --state-file .monitor/state.json \
            --output-dir reports \
            --work-dir out

      - name: Commit automation and initial report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ai-tax-legal-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment change to commit."
            exit 0
          fi
          git commit -m "feat: deploy daily TAXiA CLOA tax legal monitor"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish or update initial GitHub issue
        if: always() && hashFiles('out/issue_body.md') != ''
        uses: actions/github-script@v7
        env:
          ISSUE_LABEL: daily-monitoring
          ASSIGNEE: LifeIsMoment
        with:
          script: |
            const fs = require('fs');
            const title = fs.readFileSync('out/issue_title.txt', 'utf8').trim();
            const body = fs.readFileSync('out/issue_body.md', 'utf8');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = process.env.ISSUE_LABEL;
            const assignee = process.env.ASSIGNEE;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: '1D76DB',
                description: 'AI 세무·법률 및 TAXiA·CLOA 일일 보고'
              });
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              labels: label,
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body,
                state: 'open',
                labels: [label],
                assignees: [assignee],
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [label],
                assignees: [assignee],
              });
            }

      - name: Add report to workflow summary
        if: always() && hashFiles('out/summary.md') != ''
        shell: bash
        run: cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bootstrap diagnostics
        if: always() && hashFiles('out/metadata.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-monitor-diagnostics-${{ github.run_id }}
          path: out/
          retention-days: 30

      - name: Mark bootstrap run failed when collection health is insufficient
        if: steps.collect.outcome == 'failure'
        run: exit 1
