name: Trigger AI monitor deployment verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trigger-monitor-once.yml"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full monitor verification run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'daily-monitor.yml',
              ref: 'main',
              inputs: { lookback_hours: '168' }
            });
