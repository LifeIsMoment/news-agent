name: Run Finance Quality Verification Once

on:
  issues:
    types: [opened]

permissions:
  actions: write
  issues: write

jobs:
  dispatch:
    if: github.event.issue.title == '[RUN FINANCE QUALITY VERIFICATION]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch quality workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'daily-finance-monitor-quality.yml',
              ref: 'main'
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'AI 재무·세무·회계 품질분석 및 제한형 자동개선 워크플로를 수동 검증 실행했습니다.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
