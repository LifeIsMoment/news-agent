name: Run Finance Verification Once

on:
  issues:
    types: [opened, reopened]

permissions:
  actions: write
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch requested workflow
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.issue.title;
            const allowed = new Set([
              '[RUN FINANCE MONITOR VERIFICATION]',
              '[RUN FINANCE QUALITY VERIFICATION]'
            ]);
            if (!allowed.has(title)) {
              core.info(`Ignoring unrelated issue: ${title}`);
              return;
            }
            let workflowId;
            let inputs;
            let description;
            if (title === '[RUN FINANCE MONITOR VERIFICATION]') {
              workflowId = 'daily-finance-tax-ai-monitor.yml';
              inputs = { lookback_hours: '40' };
              description = 'AI 재무·세무·회계 핵심 모니터';
            } else {
              workflowId = 'daily-finance-monitor-quality.yml';
              description = 'AI 재무·세무·회계 품질분석 및 제한형 자동개선';
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              ref: 'main',
              ...(inputs ? { inputs } : {})
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${description} 워크플로를 수동 검증 실행했습니다.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
