name: Daily AI Finance Tax Accounting Monitor

on:
  schedule:
    # 07:00 Asia/Seoul (UTC+9; Korea has no daylight-saving time)
    - cron: "0 22 * * *"
    # 07:20 watchdog: run only if today's primary report is absent.
    - cron: "20 22 * * *"
    # One-time bootstrap trigger. Removed automatically after the first completed run.
    - cron: "*/5 * * * *" # TEMP_FINANCE_BOOTSTRAP_20260724
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "수동 실행 시 조회 시간 범위"
        required: false
        default: "72"
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-ai-finance-tax-accounting-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MONITOR_STATE: .monitor/finance-tax-ai-state.json
      REPORT_DIR: reports-finance-tax-ai
      WORK_DIR: out-finance-tax-ai
      ISSUE_LABEL: finance-tax-ai-monitoring
      FAILURE_LABEL: finance-tax-ai-monitor-failure
      ASSIGNEE: LifeIsMoment
      BUNDLE_SHA256: 58f3071661f62021e3714f7430df408e51d4b482094a442c75e37a70462dc54c

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide whether this run should collect
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "schedule" || "${{ github.event.schedule }}" == "0 22 * * *" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "reason=primary-or-manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          state_path = Path(os.environ["MONITOR_STATE"])
          today = dt.datetime.now(dt.timezone.utc).astimezone(ZoneInfo("Asia/Seoul")).date()
          try:
              state = json.loads(state_path.read_text(encoding="utf-8"))
              stamp = state.get("last_success_at")
              last = dt.datetime.fromisoformat(stamp.replace("Z", "+00:00")) if stamp else None
              last_date = last.astimezone(ZoneInfo("Asia/Seoul")).date() if last else None
          except Exception:
              last_date = None

          print("should_run=false" if last_date == today else "should_run=true")
          print("reason=today-already-succeeded" if last_date == today else "reason=today-report-missing")
          PY

      - name: Restore verified finance monitor source
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f .finance-bootstrap/part-00
          cat .finance-bootstrap/part-* | base64 --decode > /tmp/finance-monitor.tar.gz
          echo "${BUNDLE_SHA256}  /tmp/finance-monitor.tar.gz" | sha256sum --check --strict
          rm -rf /tmp/finance-monitor-unpacked
          mkdir -p /tmp/finance-monitor-unpacked
          tar -xzf /tmp/finance-monitor.tar.gz -C /tmp/finance-monitor-unpacked

          install -d config tests
          cp /tmp/finance-monitor-unpacked/finance_monitor.py finance_monitor.py
          cp /tmp/finance-monitor-unpacked/config/finance_sources.json config/finance_sources.json
          cp /tmp/finance-monitor-unpacked/tests/test_finance_monitor.py tests/test_finance_monitor.py
          chmod +x finance_monitor.py

      - name: Validate source and configuration
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile finance_monitor.py
          python -m json.tool config/finance_sources.json >/dev/null
          python -m unittest discover -s tests -p 'test_finance_monitor.py' -v

      - name: Collect, classify and generate report
        id: collect
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LOOKBACK="${{ inputs.lookback_hours }}"
          elif [[ "${{ github.event.schedule }}" == "*/5 * * * *" ]]; then
            LOOKBACK="168"
          else
            LOOKBACK="40"
          fi

          python finance_monitor.py \
            --config config/finance_sources.json \
            --lookback-hours "$LOOKBACK" \
            --state-file "$MONITOR_STATE" \
            --output-dir "$REPORT_DIR" \
            --work-dir "$WORK_DIR"
          STATUS=$?
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Commit source, report and monitor state
        if: always() && steps.gate.outputs.should_run == 'true' && hashFiles('out-finance-tax-ai/metadata.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DATE="$(python -c 'import json; print(json.load(open("out-finance-tax-ai/metadata.json"))["date"])')"
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "*/5 * * * *" ]]; then
            sed -i '/TEMP_FINANCE_BOOTSTRAP_20260724/d' .github/workflows/daily-finance-tax-ai-monitor.yml
          fi
          git config user.name "ai-finance-tax-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            finance_monitor.py \
            config/finance_sources.json \
            tests/test_finance_monitor.py \
            .github/workflows/daily-finance-tax-ai-monitor.yml \
            "$MONITOR_STATE" \
            "$REPORT_DIR"/
          if git diff --cached --quiet; then
            echo "No finance report/state change to commit."
            exit 0
          fi
          git commit -m "finance-monitor: publish ${REPORT_DATE} report"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Remove temporary bootstrap schedule after a skipped run
        if: always() && steps.gate.outputs.should_run == 'false' && github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/TEMP_FINANCE_BOOTSTRAP_20260724/d' .github/workflows/daily-finance-tax-ai-monitor.yml
          git config user.name "ai-finance-tax-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/daily-finance-tax-ai-monitor.yml
          git commit -m "ci: remove temporary finance monitor bootstrap schedule"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish or update daily finance report issue
        if: always() && steps.gate.outputs.should_run == 'true' && hashFiles('out-finance-tax-ai/issue_body.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = fs.readFileSync('out-finance-tax-ai/issue_title.txt', 'utf8').trim();
            const body = fs.readFileSync('out-finance-tax-ai/issue_body.md', 'utf8');
            const label = process.env.ISSUE_LABEL;
            const assignee = process.env.ASSIGNEE;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: '0E8A16',
                description: 'AI 재무·세무·회계 일일 자동 보고서'
              });
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: label, per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, title, body,
                state: 'open', labels: [label], assignees: [assignee]
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: [label], assignees: [assignee]
              });
            }

      - name: Add report to workflow summary
        if: always() && hashFiles('out-finance-tax-ai/summary.md') != ''
        run: cat out-finance-tax-ai/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always() && steps.gate.outputs.should_run == 'true' && hashFiles('out-finance-tax-ai/metadata.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: finance-tax-ai-monitor-diagnostics-${{ github.run_id }}
          path: out-finance-tax-ai/
          retention-days: 30

      - name: Open or update failure issue
        if: failure() || steps.collect.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = process.env.FAILURE_LABEL;
            const assignee = process.env.ASSIGNEE;
            const date = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(new Date());
            const title = `[AI 재무·세무·회계 자동화 실패] ${date}`;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              'AI 재무·세무·회계 자동 모니터링이 실패했거나 임계 수준의 수집 장애를 감지했습니다.',
              '',
              `- 실행: [GitHub Actions run ${context.runId}](${runUrl})`,
              `- 이벤트: ${context.eventName}`,
              `- 커밋: ${context.sha}`,
              `- 수집 단계 결과: ${{ steps.collect.outcome }}`,
              `- 수집기 종료 코드: ${{ steps.collect.outputs.exit_code }}`,
              '',
              '실행 로그와 finance monitor diagnostics artifact를 확인하십시오.'
            ].join('\n');

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'B60205',
                description: 'AI 재무·세무·회계 자동화 실패 또는 중대한 수집 장애'
              });
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: label, per_page: 100
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, body, state: 'open',
                labels: [label], assignees: [assignee]
              });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body, labels: [label], assignees: [assignee]
              });
            }

      - name: Close today's failure issue after recovery
        if: steps.collect.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const date = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
            }).format(new Date());
            const title = `[AI 재무·세무·회계 자동화 실패] ${date}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: process.env.FAILURE_LABEL, per_page: 100
            });
            for (const issue of issues.filter((row) => !row.pull_request && row.title === title)) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: `후속 실행 ${context.runId}에서 AI 재무·세무·회계 자동 보고가 복구되었습니다.`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed'
              });
            }

      - name: Mark run failed when collector failed
        if: steps.collect.outcome == 'failure'
        run: exit 1

      - name: Record watchdog skip
        if: steps.gate.outputs.should_run == 'false'
        run: echo "Today's finance/tax/accounting report already exists; watchdog skipped." >> "$GITHUB_STEP_SUMMARY"
